name: ActivityWeather
options:
  bundleIdPrefix: com.activityweather
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  ActivityWeather:
    type: application
    platform: iOS
    sources:
      - ActivityWeather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.activityweather.app
        INFOPLIST_KEY_CFBundleDisplayName: Activity Weather
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
  ActivityWeatherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ActivityWeatherTests
    dependencies:
      - target: ActivityWeather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.activityweather.app.tests
        GENERATE_INFOPLIST_FILE: YES
